<nav data-cy="navbar" class="navbar navbar-expand-md fixed-top boardroom-nav">
  <div class="container-fluid">
    <a class="navbar-brand logo" routerLink="/" (click)="collapseNavbar()">
      <img src="content/images/logo-jhipster.png" alt="Boardroom Logo" class="nav-logo" />
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleNavbar()"
      aria-controls="navbarResponsive"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <fa-icon icon="bars"></fa-icon>
    </button>

    <div class="navbar-collapse collapse" id="navbarResponsive" [ngbCollapse]="isNavbarCollapsed()">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a class="nav-link" routerLink="/" (click)="collapseNavbar()">
            <span>Home</span>
          </a>
        </li>

        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" (click)="navigazioneProtetta('/prenota-sala')" style="cursor: pointer">
            <span>Prenota sala</span>
          </a>
        </li>

        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" (click)="navigazioneProtetta('/mie-prenotazioni')" style="cursor: pointer">
            <span>Le mie prenotazioni</span>
          </a>
        </li>

        @if (hasAnyAuthority('ROLE_ADMIN')) {
          <li ngbDropdown class="nav-item dropdown pointer" display="dynamic" routerLinkActive="active">
            <a class="nav-link dropdown-toggle admin-link" ngbDropdownToggle href="javascript:void(0);" id="entity-menu">
              <span>Amministrazione</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg" ngbDropdownMenu aria-labelledby="entity-menu">
              <li><a class="dropdown-item" routerLink="/sale" (click)="collapseNavbar()">Sale</a></li>
              <li><a class="dropdown-item" routerLink="/utenti" (click)="collapseNavbar()">Utenti</a></li>
              <li><a class="dropdown-item" routerLink="/stati-prenotazione" (click)="collapseNavbar()">Stati</a></li>
              <li><a class="dropdown-item" routerLink="/prenotazioni" (click)="collapseNavbar()">Prenotazioni</a></li>
              <li><a class="dropdown-item" routerLink="/eventi" (click)="collapseNavbar()">Eventi</a></li>
            </ul>
          </li>
        }

        <li class="nav-item ms-lg-3">
          @let accountRef = account();
          @if (accountRef !== null) {
            <a class="nav-link p-0 profile-link-wrapper" routerLink="/profilo-utente" (click)="collapseNavbar()" title="Vai al mio profilo">
              <div class="avatar-nav-wrapper">
                <img *ngIf="accountRef?.imageUrl" [src]="accountRef!.imageUrl" class="profile-image-nav" alt="Avatar" />
                <div *ngIf="!accountRef?.imageUrl" class="avatar-placeholder">
                  <fa-icon icon="user"></fa-icon>
                </div>
              </div>
            </a>
          } @else {
            <a class="nav-link login-link-green" (click)="login()" style="cursor: pointer">
              <fa-icon icon="user" class="me-2"></fa-icon>
              <span>Accedi</span>
            </a>
          }
        </li>
      </ul>
    </div>
  </div>
</nav>
