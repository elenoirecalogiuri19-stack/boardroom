<div class="login-wrapper">
  <div class="login-card">
    @if (authenticationError()) {
      <div class="alert alert-danger">Email o password errati.</div>
    }

    <form (ngSubmit)="login()" [formGroup]="loginForm" class="login-form">
      <div class="input-group">
        <input #username type="text" class="figma-input" placeholder="Username" formControlName="username" />
      </div>

      <div class="input-group">
        <input type="password" class="figma-input" placeholder="Password" formControlName="password" />
      </div>

      <button type="submit" class="figma-btn" [disabled]="isLoading">
        <span class="btn-text">{{ isLoading ? 'Accesso in corso...' : 'Accedi' }}</span>
      </button>
    </form>

    <div class="figma-footer">
      <a routerLink="/account/reset/request" class="green-link">Password dimenticata?</a>
      <div class="register-section">
        <span class="small-text">Non hai un account?</span>
        <a routerLink="/account/register" class="green-link"><strong>Crea un account</strong></a>
      </div>
    </div>
  </div>
</div>
