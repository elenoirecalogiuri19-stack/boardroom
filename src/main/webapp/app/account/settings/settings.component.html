<div class="settings-container">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <h1 class="settings-title">Impostazioni account</h1>
      <p class="settings-subtitle">Aggiorna le tue informazioni personali qui sotto.</p>

      @if (success()) {
        <div class="alert alert-success shadow-sm"><strong>Profilo aggiornato!</strong> Le modifiche sono state salvate correttamente.</div>
      }

      <form name="form" role="form" (ngSubmit)="save()" [formGroup]="settingsForm" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="firstName">Nome</label>
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="firstName"
              formControlName="firstName"
              placeholder="Inserisci il tuo nome"
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label" for="lastName">Cognome</label>
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              placeholder="Inserisci il tuo cognome"
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="email">Indirizzo Email</label>
          <input type="email" class="form-control" id="email" name="email" formControlName="email" placeholder="La tua email" />
        </div>

        <button type="submit" [disabled]="settingsForm.invalid || isLoading()" class="btn-save">
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          <span>Salva impostazioni</span>
        </button>
      </form>
    </div>
  </div>
</div>
